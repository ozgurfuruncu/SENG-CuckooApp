name: Stack A bootstrap
on:
  pull_request:
    branches: [main, develop, feature/sprint1-repo-bootstrap]
  push:
    branches: [main, develop, feature/stack-a-bootstrap, release/sprint-1]
permissions:
  contents: read
jobs:
  backend:
    name: Stack A backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cuckoo
          POSTGRES_PASSWORD: cuckoo-test-only
          POSTGRES_DB: cuckoo_tests
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U cuckoo -d cuckoo_tests"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      BOOTSTRAP_TEST_DATABASE_URL: postgresql+psycopg://cuckoo:cuckoo-test-only@localhost:5432/cuckoo_tests
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - run: pip install --require-hashes -r requirements.lock
      - run: python -m pytest --cov=app --cov-report=term-missing --cov-fail-under=50
  frontend:
    name: Stack A frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
  compose:
    name: Stack A Compose smoke
    runs-on: ubuntu-latest
    env:
      BOOTSTRAP_COMPOSE_PROJECT: cuckoo-ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/compose_smoke.py
