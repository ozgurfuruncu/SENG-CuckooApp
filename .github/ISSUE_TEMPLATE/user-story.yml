name: User story
description: Sprint backlog story or implementation slice
title: "[US-XX] "
body:
  - type: textarea
    id: story
    attributes:
      label: User story
      placeholder: As a ..., I want ..., so that ...
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      placeholder: Given / When / Then or testable bullets
      description: Use stable AC01/AC02 IDs, include negative authorization/state cases. Follow docs/templates/SDD_WORKFLOW.md.
    validations:
      required: true
  - type: textarea
    id: api
    attributes:
      label: API / dependency impact
      description: OpenAPI operations, dependencies, migrations, security/state impacts.
  - type: textarea
    id: evidence
    attributes:
      label: Expected evidence
      description: Tests, screenshots, docs, review evidence.
  - type: textarea
    id: readiness
    attributes:
      label: Ownership, specification and readiness
      description: Name owner/reviewer, priority/estimate, spec URL, contract SHA/operations, dependencies, actual PO/TL/QA approval sources or pending decisions. Use existing issues for routine follow-ups.
    validations:
      required: true
