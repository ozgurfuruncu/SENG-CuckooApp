services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cuckoo
      POSTGRES_PASSWORD: ${BOOTSTRAP_POSTGRES_PASSWORD:-cuckoo-local-only}
      POSTGRES_DB: cuckoo
    volumes:
      - bootstrap_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U cuckoo -d cuckoo]
      interval: 2s
      timeout: 3s
      retries: 30
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.bootstrap
    environment:
      DATABASE_URL: postgresql+psycopg://cuckoo:${BOOTSTRAP_POSTGRES_PASSWORD:-cuckoo-local-only}@db:5432/cuckoo
    ports:
      - "127.0.0.1:${BOOTSTRAP_API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health', timeout=5)"]
      interval: 2s
      timeout: 6s
      retries: 30
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.bootstrap
    ports:
      - "127.0.0.1:${BOOTSTRAP_WEB_PORT:-5173}:5173"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, "fetch('http://localhost:5173').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 2s
      timeout: 5s
      retries: 30
volumes:
  bootstrap_pgdata:
